name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: GunplaFabricationSuite.dmg
          - os: windows-latest
            artifact_name: GunplaFabricationSuite.zip
          - os: ubuntu-latest
            artifact_name: GunplaFabricationSuite.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller gunpla_fabrication_suite.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname GunplaFabricationSuite -srcfolder dist/GunplaFabricationSuite.app \
            -ov -format UDZO dist/GunplaFabricationSuite.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GunplaFabricationSuite -DestinationPath dist/GunplaFabricationSuite.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/GunplaFabricationSuite.tar.gz -C dist GunplaFabricationSuite

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
